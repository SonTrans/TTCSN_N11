services:
  mysql:
    image: mysql:8.4
    command: --default-time-zone=+00:00
    environment:
      MYSQL_DATABASE: ckd_screening
      MYSQL_USER: ckd
      MYSQL_PASSWORD: ckd
      MYSQL_ROOT_PASSWORD: local-root-password
    ports:
      - "3306:3306"
    volumes:
      - ckd_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -plocal-root-password --silent"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  ckd_mysql_data:
