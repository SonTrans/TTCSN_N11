server:
  port: ${SERVER_PORT:8080}
spring:
  application:
    name: ckd-screening-backend
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/ckd_screening?useUnicode=true&characterEncoding=UTF-8&connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true}
    username: ${DB_USERNAME:ckd}
    password: ${DB_PASSWORD:ckd}
  jpa:
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
application:
  jwt:
    secret: ${JWT_SECRET:local-development-secret-change-before-production-2026}
    access-token-minutes: ${JWT_ACCESS_MINUTES:480}
  ai:
    base-url: ${AI_API_URL:}
    api-key: ${AI_API_KEY:}
    connect-timeout-seconds: ${AI_CONNECT_TIMEOUT_SECONDS:3}
    read-timeout-seconds: ${AI_READ_TIMEOUT_SECONDS:10}
  cors:
    allowed-origin: ${FRONTEND_ORIGIN:http://localhost:5173}
springdoc:
  swagger-ui:
    path: /swagger-ui.html
